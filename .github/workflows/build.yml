# On every push to main: run the tests, build CapyBar.app (ad-hoc signed) and publish
# it as build/CapyBar.zip on the rolling "latest" release, so the newest build is always
# at https://github.com/stepn1k/CapyBar/releases/latest/download/CapyBar.zip
# Then the version and build date in README's download line are refreshed.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release, push the README update

# One build at a time; a newer push waits instead of racing the release update.
concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    # The Xcode 27 image runs on macOS 27 (Apple Silicon), the only macOS CapyBar supports.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift run CapyBarTests

      - name: Build CapyBar.zip
        run: scripts/bundle.sh --zip

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          SHORT_SHA="${GITHUB_SHA::7}"
          # Recreate the release so its tag always points at the commit that was built.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest build/CapyBar.zip build/version.json \
            --target "$GITHUB_SHA" \
            --title "CapyBar $VERSION (main, $SHORT_SHA)" \
            --notes "Automatic build of main at $GITHUB_SHA. Ad-hoc signed, not notarized: after moving CapyBar.app to Applications, allow it once in System Settings → Privacy & Security → Open Anyway."

      # Pushes made with GITHUB_TOKEN don't start workflows, so this commit doesn't loop.
      - name: Update the download line in README
        run: |
          scripts/readme-download.sh
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README download to $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist) [skip ci]" README.md
          # If main moved on while we built, the next run updates README instead.
          git push origin HEAD:main || echo "::warning::main moved on; README is left to the next build"
