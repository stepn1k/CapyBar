# Pull requests and pushes to main: lint, test, build. Nothing is published.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: swift format lint --strict --recursive Sources Package.swift scripts/make-icon.swift

      - name: Test
        run: swift run CapyBarTests

      - name: Build CapyBar.app
        run: scripts/bundle.sh

      - name: Version this would release as
        run: scripts/next-version.sh
