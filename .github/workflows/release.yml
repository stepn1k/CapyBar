# Every push to main that changes the app: lint, test and build with a read-only token,
# then publish release vX.Y.Z (version from scripts/next-version.sh) with a signed
# build provenance attestation. The release job runs no code from the repository.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "Sources/CapyBar/**"
      - "Sources/CapyBarCore/**"
      - "Sources/MenuBarPrivate/**"
      - "Resources/**"
      - "Package.swift"
      - "scripts/bundle.sh"
  workflow_dispatch:

permissions: {}

# One release at a time, so versions don't collide.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # next-version.sh needs tags and history
          persist-credentials: false

      - name: Lint
        run: swift format lint --strict --recursive Sources Package.swift scripts/make-icon.swift

      - name: Test
        run: swift run CapyBarTests

      - name: Version
        id: version
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$GITHUB_SHA is already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r VERSION BUILD PREVIOUS < <(scripts/next-version.sh)
          echo "Releasing $VERSION (build $BUILD) after ${PREVIOUS:-nothing}"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"

      - name: Build CapyBar.zip
        if: steps.version.outputs.skip != 'true'
        env:
          CAPYBAR_VERSION: ${{ steps.version.outputs.version }}
          CAPYBAR_BUILD: ${{ steps.version.outputs.build }}
        run: scripts/bundle.sh --zip

      # The "What's new" list: subjects of the commits since the last release that
      # changed the app (same paths as the trigger above), oldest first.
      - name: Changes
        if: steps.version.outputs.skip != 'true'
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          RANGE="${PREVIOUS:+$PREVIOUS..}HEAD"
          git log --no-merges --reverse --format='- %s' "$RANGE" -- \
            Sources/CapyBar Sources/CapyBarCore Sources/MenuBarPrivate Resources Package.swift \
            > build/changes.md
          [[ -s build/changes.md ]] || echo "- Maintenance release." > build/changes.md
          cat build/changes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.skip != 'true'
        with:
          name: release
          path: |
            build/CapyBar.zip
            build/version.json
            build/changes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    # Also on a re-run of a released commit, so the cleanup below still happens.
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and its tag
      id-token: write # sign the attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS: ${{ needs.build.outputs.previous }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.skip != 'true'
        with:
          name: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.build.outputs.skip != 'true'
        with:
          subject-path: CapyBar.zip

      - name: Publish
        if: needs.build.outputs.skip != 'true'
        # GitHub always adds the "Source code" archives to a release; the notes lead
        # with a direct link to the app so nobody has to find it among them.
        run: |
          SHA256="$(sha256sum CapyBar.zip | cut -d' ' -f1)"
          DOWNLOAD="https://github.com/$GH_REPO/releases/download/v$VERSION/CapyBar.zip"
          {
            cat <<EOF
          ## [⬇️ Download CapyBar $VERSION]($DOWNLOAD)

          For macOS 27 or later.

          ### What's new

          EOF
            cat changes.md
            cat <<EOF

          ### Install

          1. Unzip **CapyBar.zip** and open **CapyBar.app**. CapyBar isn't notarized, so macOS blocks it: click **Done**, then **System Settings → Privacy & Security → Open Anyway**.
          2. CapyBar moves itself into **Applications** (it only works from there) and opens again.
          3. Grant **Accessibility** when asked. macOS asks again after every update.

          Updating? Open the new version the same way: it replaces the old one in Applications.

          <details>
          <summary>Verify the download</summary>

          SHA-256 of CapyBar.zip: \`$SHA256\`

          Built by GitHub Actions from this release's commit, with a signed build provenance attestation:

          \`\`\`
          gh attestation verify CapyBar.zip -R $GH_REPO
          \`\`\`

          \`version.json\` is for the app's update check; you don't need it.
          </details>
          EOF
            if [[ -n "$PREVIOUS" ]]; then
              echo
              echo "**Full changelog:** https://github.com/$GH_REPO/compare/$PREVIOUS...v$VERSION"
            fi
          } > notes.md
          gh release create "v$VERSION" CapyBar.zip version.json \
            --target "$GITHUB_SHA" \
            --title "CapyBar $VERSION" \
            --latest \
            --notes-file notes.md

      # One-time cleanup of the old rolling release; safe to remove afterwards.
      - name: Remove the legacy "latest" release
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
